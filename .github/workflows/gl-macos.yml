# GitLab macOS 作业桥接执行器
#
# 触发：GitLab 桥接 job 调 repository_dispatch（event_type=gl-macos-job），
#       client_payload 携带 correlation_id / gl_server / gl_project(_id) /
#       gl_sha / env(白名单 CI 变量) / script_b64(作业脚本)。
# 本仓库只做通用执行：按 allowlist 路由 → 按 SHA 克隆 GitLab 源码 →
# 执行脚本 → dist/* 回传 GitLab generic package registry。
# 门禁回传不靠这里：GitLab 侧桥接 job 轮询本 run 终态并镜像为退出码。
#
# 安全红线（改动本文件必须 review）：
#   1. payload 是半公开数据——任何凭据绝不放 client_payload；
#      凭据只经 secrets + env: 注入（本文件已如此）。
#   2. payload 字段不得进入 run: 的 ${{ }} 直接插值（脚本注入），只经 env: 间接引用；
#      结构性字段（runs-on/concurrency）只消费 allowlist 里的静态值并白名单校验。
#   3. 不引入第三方 action；不添加 pull_request 触发器（防 fork 注入读 secrets）。

name: GitLab macOS bridge
run-name: "${{ github.event.client_payload.gl.project }} · ${{ github.event.client_payload.correlation_id }}"

on:
  repository_dispatch:
    types: [gl-macos-job]

permissions:
  contents: read

concurrency:
  # 同项目+同分支+同作业：新 run 自动取代旧 run（对齐 GitLab interruptible 语义）
  group: "gl-${{ github.event.client_payload.gl.project }}-${{ github.event.client_payload.gl.ref }}-${{ github.event.client_payload.gl.job_name }}"
  cancel-in-progress: true

env:
  # 项目注册表（allowlist）：GitLab project_id → 配置。
  #   gl_path: 克隆路径（不含 .git）；runner: macOS runner 标签（须匹配下方校验）；
  #   status:  是否回传 GitLab commit status（该 API 需 Maintainer 级 token，默认关）。
  # 新接入 GitLab 仓库 = 加一行 + 加一个 GL_PAT_<id> secret。
  PROJECTS: >-
    {"131": {"gl_path": "chenkaidi/work-review", "runner": "macos-15", "status": false}}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.cfg.outputs.runner }}
      gl_path: ${{ steps.cfg.outputs.gl_path }}
      status: ${{ steps.cfg.outputs.status }}
    env:
      PL: ${{ toJSON(github.event.client_payload) }}
    steps:
      - name: Resolve project from allowlist
        id: cfg
        run: |
          set -euo pipefail
          id=$(jq -r '.gl.project_id // empty' <<<"$PL")
          [ -n "$id" ] || { echo "payload missing gl_project_id" >&2; exit 1; }
          runner=$(jq -r --arg id "$id" '.[$id].runner // empty' <<<"$PROJECTS")
          if [ -z "$runner" ]; then
            echo "::error::GitLab project ${id} not registered in PROJECTS allowlist"
            exit 1
          fi
          # runner 标签必须命中白名单：它是唯一允许流入 runs-on 的动态值
          case "$runner" in
            macos-1[0-9]|macos-1[0-9]-intel|macos-2[0-9]|macos-2[0-9]-intel|macos-latest)
              ;;
            *)
              echo "::error::runner label '${runner}' not in allowlist"
              exit 1 ;;
          esac
          {
            echo "runner=${runner}"
            echo "gl_path=$(jq -r --arg id "$id" '.[$id].gl_path // empty' <<<"$PROJECTS")"
            echo "status=$(jq -r --arg id "$id" '.[$id].status // false' <<<"$PROJECTS")"
          } >> "$GITHUB_OUTPUT"

  macos:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    timeout-minutes: 30
    env:
      PL: ${{ toJSON(github.event.client_payload) }}
      GL_PAT: ${{ secrets.GL_PAT_131 }}
    steps:
      - name: Checkout GitLab source at exact SHA
        env:
          GL_PATH: ${{ needs.resolve.outputs.gl_path }}
        run: |
          set -euo pipefail
          gl_server=$(jq -r '.gl.server | select(. != "")' <<<"$PL")
          gl_sha=$(jq -r '.gl.sha | select(. != "")' <<<"$PL")
          [ -n "$gl_server" ] && [ -n "$gl_sha" ] && [ -n "$GL_PATH" ] || {
            echo "payload incomplete (gl_server/gl_sha/gl_path)" >&2; exit 1; }
          [ -n "$GL_PAT" ] || { echo "secret GL_PAT missing" >&2; exit 1; }
          git init -q src
          git -C src remote add origin "https://oauth2:${GL_PAT}@${gl_server}/${GL_PATH}.git"
          git -C src -c protocol.version=2 fetch --depth=1 --no-tags origin "${gl_sha}"
          git -C src checkout --detach FETCH_HEAD
          echo "checked out $(git -C src log --oneline -1 | head -c 72)"

      - name: Run GitLab job script
        working-directory: src
        run: |
          set -euo pipefail
          # macOS 自带 base64 是 BSD 版（-d 解码行为不保证），用 runner 必预装的 python3 解码
          jq -r '.script_b64 | select(. != "")' <<<"$PL" \
            | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' \
            > /tmp/gl-job.sh
          [ -s /tmp/gl-job.sh ] || { echo "empty job script" >&2; exit 1; }
          # 白名单 CI_* 变量注入（值经 jq @sh 安全引用）
          jq -r '(.env // {}) | to_entries[] | "export \(.key)=\(.value | @sh)"' <<<"$PL" > /tmp/gl-env.sh
          bash -c 'set -euo pipefail; source /tmp/gl-env.sh; export CI_PROJECT_DIR="$PWD"; bash /tmp/gl-job.sh'

      - name: Upload artifacts back to GitLab package registry
        if: always()
        working-directory: src
        run: |
          set -euo pipefail
          if ! compgen -G 'dist/*' >/dev/null; then
            echo "no dist/ artifacts to upload"; exit 0
          fi
          corr=$(jq -r '.correlation_id' <<<"$PL")
          gl_server=$(jq -r '.gl.server' <<<"$PL")
          gl_pid=$(jq -r '.gl.project_id' <<<"$PL")
          tgz="/tmp/${corr}.tgz"
          tar -czf "$tgz" dist
          url="https://${gl_server}/api/v4/projects/${gl_pid}/packages/generic/macos-bridge/${corr}/${corr}.tgz"
          curl -sS --fail-with-body -X PUT "$url" \
            -H "PRIVATE-TOKEN: ${GL_PAT}" --upload-file "$tgz"
          echo "artifact → ${url}"

      - name: Report commit status to GitLab (optional)
        if: always() && needs.resolve.outputs.status == 'true'
        run: |
          set -euo pipefail
          st=success; [ "${{ job.status }}" = success ] || st=failed
          gl_server=$(jq -r '.gl.server' <<<"$PL")
          gl_pid=$(jq -r '.gl.project_id' <<<"$PL")
          gl_sha=$(jq -r '.gl.sha' <<<"$PL")
          curl -sS --fail-with-body -o /dev/null -X POST \
            "https://${gl_server}/api/v4/projects/${gl_pid}/statuses/${gl_sha}" \
            -H "PRIVATE-TOKEN: ${GL_PAT}" \
            -d "name=github-macos" -d "state=${st}" \
            -d "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -d "description=$(jq -r '.gl.job_name' <<<"$PL")"

      - name: Summary
        if: always()
        run: |
          {
            echo "## GitLab macOS bridge"
            echo "- job: $(jq -r '.gl.job_name' <<<"$PL") @ $(jq -r '.gl.sha' <<<"$PL" | head -c 8)"
            echo "- result: ${{ job.status }}"
            echo "- GitLab pipeline: https://$(jq -r '.gl.server' <<<"$PL")/$(jq -r '.gl.project' <<<"$PL")/-/pipelines/$(jq -r '.gl.pipeline' <<<"$PL")"
          } >> "$GITHUB_STEP_SUMMARY"
